# Collects the results of the batch in .github/waves/dispatch.json (fork releases and Space branches) and commits
# them to branch wave-collected of this repository: <wave>/summaries.jsonl and <wave>/status.txt.
# Trigger: push that touches .github/waves/collect.trigger on a work branch. No schedule.
name: wave-collect

on:
  push:
    branches: ['feature/v4*', 'claude/project-thread-o7nshg', 'wave/**']
    paths: ['.github/waves/collect.trigger']

permissions:
  contents: write

concurrency: wave-collect

jobs:
  collect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Collect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CFG=.github/waves/dispatch.json; [ -f .github/waves/self.json ] && CFG=.github/waves/self.json
          WAVE=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['wave'])" $CFG)
          git fetch -q origin wave-collected || true
          mkdir -p /tmp/c/$WAVE
          git show FETCH_HEAD:$WAVE/summaries.jsonl > /tmp/c/$WAVE/summaries.jsonl 2>/dev/null || rm -f /tmp/c/$WAVE/summaries.jsonl
          set +e
          python3 .github/scripts/collect_wave.py $CFG --out /tmp/c/$WAVE/summaries.jsonl 2>&1 | tee /tmp/c/$WAVE/status.txt
          echo "collector exit ${PIPESTATUS[0]}, $(date -u +%FT%TZ), commit ${{ github.sha }}" >> /tmp/c/$WAVE/status.txt
          set -e
          cat /tmp/c/$WAVE/status.txt >> "$GITHUB_STEP_SUMMARY"
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse -q --verify FETCH_HEAD > /dev/null && git ls-remote --exit-code origin refs/heads/wave-collected > /dev/null; then
            git checkout -q -B wave-collected FETCH_HEAD
          else
            git checkout -q --orphan wave-collected && git rm -rfq .
          fi
          mkdir -p $WAVE && cp /tmp/c/$WAVE/* $WAVE/ && git add $WAVE
          git commit -q -m "wave: collect $WAVE" || exit 0
          git push -q origin wave-collected
